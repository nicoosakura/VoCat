# VoCat 桌面控制端 · electron-builder 双平台构建配置
# macOS: .dmg（签名 + 公证需在 CI 提供证书与 notary 凭据）
# Windows: NSIS .exe（可选代码签名证书）

appId: com.vocat.desktop
productName: VoCatDesktop
directories:
  output: release
  buildResources: build

# 安装包命名与桌面端 updater.js 的 assetKeywords 约定一致
# （mac-arm64 / mac-x64 / win-x64），供检查更新时匹配资源。
artifactName: VoCat-${version}-${os}-${arch}.${ext}

files:
  - src/**/*

# 内嵌的 Go 服务二进制随包分发（本地一体模式使用）
extraResources:
  - from: resources/services
    to: services
    filter:
      - '**/*'

asar: true

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VoCat

# macOS 公证（需要 CI 提供 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID 环境变量与分发证书 CSC_LINK / CSC_KEY_PASSWORD）。
# 未提供签名证书时 electron-builder 会自动跳过签名（出未签名包）。
dmg:
  sign: false

mac:
  notarize: true
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# 发布渠道：GitHub Releases（更新检查与 CI 发布共用）
publish:
  provider: github
  owner: MengMengCode
  repo: VoCat